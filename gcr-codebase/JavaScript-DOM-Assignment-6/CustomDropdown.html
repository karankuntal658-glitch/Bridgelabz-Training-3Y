
<!DOCTYPE html>
<html>
<head>
    <title>Custom Dropdown</title>
    <link rel="stylesheet" href="CustomDropdown.css">
</head>
<body>
    <h2>Choose a Course</h2>

    <div id="dropdown">
        <button id="dropdownButton">Select Course</button>

        <div id="options" class="hidden">
            <button class="option">Java</button>
            <button class="option">JavaScript</button>
            <button class="option">Python</button>
            <button class="option">HTML and CSS</button>
        </div>
    </div>

    <script src="CustomDropdown.js"></script>
</body>
</html>
