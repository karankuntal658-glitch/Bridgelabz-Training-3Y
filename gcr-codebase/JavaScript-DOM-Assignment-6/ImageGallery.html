
<!DOCTYPE html>
<html>
<head>
    <title>Image Gallery</title>
    <link rel="stylesheet" href="ImageGallery.css">
</head>
<body>
    <h2>Image Gallery</h2>

    <div id="gallery">
        <img src="https://picsum.photos/id/10/300/200" alt="Forest">
        <img src="https://picsum.photos/id/20/300/200" alt="Camera">
        <img src="https://picsum.photos/id/30/300/200" alt="Nature">
        <img src="https://picsum.photos/id/40/300/200" alt="Sea">
        <img src="https://picsum.photos/id/50/300/200" alt="Animal">
        <img src="https://picsum.photos/id/60/300/200" alt="Mountain">
    </div>

    <div id="modal">
        <div id="modalContent">
            <button id="closeButton">Close</button>
            <img id="largeImage" src="" alt="Preview">
        </div>
    </div>

    <script src="ImageGallery.js"></script>
</body>
</html>
