
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="FocusForm.css">
</head>
<body>
    <header>
        <h1>Contact Form</h1>
    </header>

    <main>
        <section class="form-container">
            <form>
                <label for="name">Your Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Write your message"></textarea>

                <button type="submit">Submit</button>
            </form>

            <section class="outline-demo">
                <p class="solid-outline">Solid Outline</p>
                <p class="dashed-outline">Dashed Outline</p>
                <p class="double-outline">Double Outline</p>
            </section>
        </section>
    </main>

    <footer>
        <p>CSS Outline and Focus Practice</p>
    </footer>
</body>
</html>
