
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="TransformShowcase.css">
</head>
<body>
    <header>
        <h1>CSS Transformations</h1>
        <p>Move your mouse over each box.</p>
    </header>

    <main>
        <section class="container">
            <article class="item">
                <div class="box rotate">Rotate</div>
                <p>rotate(15deg)</p>
            </article>

            <article class="item">
                <div class="box scale">Scale</div>
                <p>scale(1.2)</p>
            </article>

            <article class="item">
                <div class="box translate">Translate</div>
                <p>translate(15px, -10px)</p>
            </article>

            <article class="item">
                <div class="box skew">Skew</div>
                <p>skew(10deg)</p>
            </article>
        </section>
    </main>

    <footer>
        <p>CSS Transform Practice</p>
    </footer>
</body>
</html>
