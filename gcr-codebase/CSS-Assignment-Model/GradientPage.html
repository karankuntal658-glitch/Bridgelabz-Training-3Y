
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="GradientPage.css">
</head>
<body>
    <header>
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>
        <section class="linear">
            <h2>Linear Gradient</h2>
            <p>The background changes smoothly from one color to another.</p>
        </section>

        <section class="radial">
            <h2>Radial Gradient</h2>
            <p>The colors spread outward from a central point.</p>
        </section>

        <section class="parallax">
            <h2>Fixed Background Effect</h2>
            <p>This section uses background-attachment: fixed.</p>
        </section>
    </main>

    <footer>
        <p>Learning CSS Gradients</p>
    </footer>
</body>
</html>
