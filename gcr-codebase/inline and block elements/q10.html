<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dropdown Selection</title>
</head>
<body>

    <h1>Travel Selection Page</h1>

    <!-- Country Selection -->
    <label for="country">Country:</label>
    <select id="country">
        <option selected>India</option>
        <option>Japan</option>
        <option>France</option>
        <option>Australia</option>
    </select>

    <br><br>

    <!-- State Selection -->
    <label for="state">State:</label>
    <select id="state">
        <option selected>Uttar Pradesh</option>
        <option>Rajasthan</option>
        <option>Maharashtra</option>
        <option>Gujarat</option>
    </select>

    <br><br>

    <!-- City Selection -->
    <label for="city">City:</label>
    <select id="city">
        <option selected>Meerut</option>
        <option>Jaipur</option>
        <option>Mumbai</option>
        <option>Ahmedabad</option>
    </select>

    <br><br>

    <!-- Tourist Place Selection -->
    <label for="place">Favorite Tourist Place:</label>
    <select id="place">
        <option selected>Taj Mahal</option>
        <option>Jaipur Palace</option>
        <option>Gateway of India</option>
        <option>Statue of Unity</option>
    </select>

    <br><br>

    <!-- Summary -->
    <p>
        My selected country is India, my state is Uttar Pradesh,
        my city is Meerut, and my favorite tourist place is the Taj Mahal.
    </p>

</body>
</html>
