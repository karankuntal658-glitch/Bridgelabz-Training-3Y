<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quotations</title>
</head>
<body>

    <h1>HTML Quotations</h1>

    <!-- Blockquote is used for a long quotation -->
    <blockquote>
        Learning HTML is an important step in understanding how websites are
        created. It provides the basic structure of a webpage and helps us
        understand how different elements work together.
        HTML uses &lt;tags&gt; to structure content.
    </blockquote>

    <!-- q is used for a short quotation -->
    <p>
        My teacher always says, <q>Practice makes perfect.</q>
    </p>

</body>
</html>
