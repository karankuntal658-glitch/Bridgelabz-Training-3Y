<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Frameset Layout</title>
</head>

<!-- Frameset divides the browser window into different frames -->
<frameset rows="30%,70%">

    <!-- Top frame contains navigation links -->
    <frame src="navigation.html" name="navigation">

    <!-- Bottom frame displays the welcome message -->
    <frame src="welcome.html" name="content">

</frameset>

</html>
