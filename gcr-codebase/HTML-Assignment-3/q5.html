<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Specifies UTF-8 character encoding -->
    <meta charset="UTF-8">

    <!-- Specifies the author of the webpage -->
    <meta name="author" content="Karan">

    <!-- Makes the webpage responsive on different devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UTF-8 Encoding</title>
</head>
<body>

    <h1>UTF-8 Encoding Example</h1>

    <p>
        English: Hello, welcome to my webpage.
        Hindi: नमस्ते, मेरी वेबसाइट पर आपका स्वागत है।
        Japanese: こんにちは、私のウェブページへようこそ。
    </p>

</body>
</html>
