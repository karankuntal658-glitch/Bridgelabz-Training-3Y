<!DOCTYPE html>
<html lang="en">

<head>

    <!-- The title defines the name displayed on the browser tab -->
    <title>Important Head Elements</title>

    <!-- The meta charset specifies the character encoding -->
    <meta charset="UTF-8">

    <!-- The meta description provides a description of the webpage -->
    <meta
        name="description"
        content="A webpage demonstrating important HTML head elements.">

    <!-- The meta author specifies the author of the webpage -->
    <meta
        name="author"
        content="Karan">

    <!-- The base tag specifies the base URL for relative links -->
    <base href="https://example.com/">

    <!-- The link tag can be used to connect external resources such as a favicon -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used to contain CSS styles -->
    <style>
    </style>

    <!-- The script tag is used to contain or link JavaScript -->
    <script>
    </script>

</head>

<body>

    <h1>Important HTML Head Elements</h1>

    <p>
        This webpage demonstrates important elements that can be placed
        inside the HTML head section.
    </p>

</body>
</html>
