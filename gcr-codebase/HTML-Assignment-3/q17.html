<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Submission</title>
</head>
<body>

    <h1>Simple Form</h1>

    <!-- Form loads the result page inside the iframe after submission -->
    <form action="result.html" method="get" target="resultFrame">

        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name" required>

        <br><br>

        <input type="submit" value="Submit">

    </form>

    <br>

    <!-- Result page will appear here after clicking Submit -->
    <iframe
        name="resultFrame"
        width="80%"
        height="200"
        title="Form Result">
    </iframe>

</body>
</html>
