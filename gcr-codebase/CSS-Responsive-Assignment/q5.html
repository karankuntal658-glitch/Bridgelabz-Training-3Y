<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <header>
        <h1>Profile Cards</h1>
    </header>

    <main>
        <section class="profiles">

            <article class="profile-card">
                <img class="gray" src="https://i.pravatar.cc/400?img=12" alt="Profile of John">
                <h2>John</h2>
                <p>Web Developer</p>
            </article>

            <article class="profile-card">
                <img class="sepia" src="https://i.pravatar.cc/400?img=32" alt="Profile of Sarah">
                <h2>Sarah</h2>
                <p>UI Designer</p>
            </article>

            <article class="profile-card">
                <img class="gray" src="https://i.pravatar.cc/400?img=52" alt="Profile of Alex">
                <h2>Alex</h2>
                <p>Software Engineer</p>
            </article>

        </section>
    </main>

</body>
</html>
