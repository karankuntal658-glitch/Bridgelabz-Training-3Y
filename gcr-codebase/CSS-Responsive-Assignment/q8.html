<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <header>
        <h1>Filter Comparison</h1>
    </header>

    <main>
        <section class="comparison">

            <figure>
                <img src="https://picsum.photos/500/350?random=20" alt="Original image">
                <figcaption>Before - Original Image</figcaption>
            </figure>

            <figure>
                <img class="filtered" src="https://picsum.photos/500/350?random=20" alt="Filtered image">
                <figcaption>After - Filtered Image</figcaption>
            </figure>

        </section>
    </main>

</body>
</html>
