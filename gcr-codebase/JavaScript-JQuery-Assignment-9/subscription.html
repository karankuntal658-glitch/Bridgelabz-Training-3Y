
<!DOCTYPE html>
<html>
<head>
    <title>Event Subscription</title>
</head>
<body>

    <h1>Subscription Panel</h1>

    <button id="subscribe">Subscribe</button>
    <button id="unsubscribe">Unsubscribe</button>

    <h3>Subscription Topics</h3>

    <ul id="topics">
        <li class="topic">Technology</li>
        <li class="topic">Sports</li>
        <li class="topic">Education</li>
        <li class="topic">Business</li>
        <li class="topic">Entertainment</li>
    </ul>

    <input type="text" id="newTopic" placeholder="Enter new topic">
    <button id="addTopic">Add Topic</button>

    <button id="removeTopic">Remove Last Topic</button>

    <p id="message"></p>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="subscription.js"></script>

</body>
</html>
