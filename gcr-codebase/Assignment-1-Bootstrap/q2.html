<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q2.css">
</head>
<body class="bg-light text-dark">

    <header class="bg-dark text-white text-center p-5">
        <h1 class="fw-bold">Karan Kuntal</h1>
        <p class="lead">Web Developer & Computer Science Student</p>
    </header>

    <main>
        <section class="container text-center mt-4 mb-3">
            <img src="https://picsum.photos/200"
                 class="img-fluid rounded-circle profile"
                 alt="Profile Image">

            <h2 class="mt-4 fw-bold">Hello, I'm Karan</h2>

            <p>
                I enjoy creating responsive websites and learning modern
                web development technologies.
            </p>

            <div class="mt-4">
                <a href="#" class="btn btn-primary me-2">Hire Me</a>
                <a href="#" class="btn btn-outline-dark">Download CV</a>
            </div>
        </section>

        <section class="container p-5">
            <h3 class="text-center fw-bold mb-3">Contact Me</h3>

            <form class="mx-auto form-box">
                <input type="text" class="form-control mb-3"
                       placeholder="Your Name">

                <input type="email" class="form-control mb-3"
                       placeholder="Your Email">

                <textarea class="form-control mb-3"
                          rows="4"
                          placeholder="Your Message"></textarea>

                <button class="btn btn-success w-100">
                    Send Message
                </button>
            </form>
        </section>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 Karan Kuntal</p>
    </footer>

</body>
</html>
