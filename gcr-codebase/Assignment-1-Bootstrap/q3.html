<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q3.css">
</head>
<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>Smart Store</h1>
        <p class="mb-0">Quality Products at Great Prices</p>
    </header>

    <main class="container py-5">

        <h2 class="text-center mb-4">Our Products</h2>

        <div class="row g-4">

            <!-- Product 1 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?1"
                         class="card-img-top"
                         alt="Laptop">
                    <div class="card-body text-center">
                        <h5>Laptop</h5>
                        <p class="fw-bold">₹55,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 2 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?2"
                         class="card-img-top"
                         alt="Headphones">
                    <div class="card-body text-center">
                        <h5>Headphones</h5>
                        <p class="fw-bold">₹2,500</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 3 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?3"
                         class="card-img-top"
                         alt="Smart Watch">
                    <div class="card-body text-center">
                        <h5>Smart Watch</h5>
                        <p class="fw-bold">₹4,999</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

            <!-- Product 4 -->
            <div class="col-12 col-sm-6 col-md-3">
                <div class="card product-card shadow-sm h-100">
                    <img src="https://picsum.photos/300/200?4"
                         class="card-img-top"
                         alt="Camera">
                    <div class="card-body text-center">
                        <h5>Camera</h5>
                        <p class="fw-bold">₹35,000</p>
                        <button class="btn btn-primary">Add to Cart</button>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 Smart Store</p>
    </footer>

</body>
</html>
