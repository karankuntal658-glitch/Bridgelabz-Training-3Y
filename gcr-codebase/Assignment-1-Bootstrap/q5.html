<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Blog</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <header class="bg-primary text-white text-center p-5">

        <div class="row g-4">

                <article class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/600/300?10"

                         alt="Web Development">

                    <div class="card-body">
                        <h3 class="card-title">Learn Web Development</h3>
                        <p class="card-text">
                            Discover the basics of HTML, CSS and Bootstrap

                        </p>
                        <a href="#" class="btn btn-primary">Read More</a>
                    </div>
                </article>
            </div>

            <div class="col-md-6">
                <article class="card h-100 shadow-sm">
                    <img src="https://picsum.photos/600/300?11"
                         class="card-img-top"
                         alt="Programming">

                    <div class="card-body">
                        <h3 class="card-title">Start Your Coding Journey</h3>
                        <p class="card-text">
                            Learn programming step by step and improve your
                            problem-solving skills.
                        </p>
                        <a href="#" class="btn btn-primary">Read More</a>
                    </div>
                </article>
            </div>

        </div>
    </main>

    <footer class="text-white text-center p-4">
        <p class="mb-0">&copy; 2026 TechWorld Blog</p>
    </footer>
