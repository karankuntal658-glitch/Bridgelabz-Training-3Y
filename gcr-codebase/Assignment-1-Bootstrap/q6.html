<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="q6.css">
</head>
<body>

    <header class="bg-dark text-white text-center p-4">
        <h1>Notifications Dashboard</h1>
    </header>

    <main class="container py-5">

        <div class="card shadow-sm">
            <div class="card-body">

                <h2 class="mb-4">Your Notifications</h2>

                <!-- Success Alert -->
                <div class="alert alert-success">
                    You have received a new message.
                </div>

                <!-- Info Alert -->
                <div class="alert alert-info">
                    Remember to update your profile information.
                </div>

                <!-- Danger Alert -->
                <div class="alert alert-danger">
                    Your password will expire soon.
                </div>

                <!-- Dismissible Alert -->
                <div class="alert alert-warning alert-dismissible fade show">
                    New system update is available.
                    <button type="button"
                            class="btn-close"
                            data-bs-dismiss="alert">
                    </button>
                </div>

                <!-- Summary Well -->
                <section class="summary bg-light border p-4 mt-4">
                    <h3>Summary</h3>
                    <p class="mb-0">
                        You have 4 notifications, 2 new messages and
                        1 important security warning.
                    </p>
                </section>

            </div>
        </div>

    </main>

    <footer class="bg-dark text-white text-center p-3">
        <p class="mb-0">&copy; 2026 Notification Center</p>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
