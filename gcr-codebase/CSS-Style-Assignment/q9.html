<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="q9.css">
</head>
<body>

    <main class="container">

        <h1>Combined Effects</h1>

        <section class="effects">

            <button class="effect-button">Hover Me</button>

            <button class="effect-button">Click Me</button>

            <a href="#" class="effect-link">Hover Link</a>

            <div class="effect-card">
                <h2>Card</h2>
                <p>Hover over this card.</p>
            </div>

        </section>

    </main>

</body>
</html>
