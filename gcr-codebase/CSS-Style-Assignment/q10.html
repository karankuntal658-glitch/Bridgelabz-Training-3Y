<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini User Interface</title>
    <link rel="stylesheet" href="q10.css">
</head>
<body>

    <header>
        <h1>My Mini UI</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <main class="container">

        <section class="card">

            <div class="image-section">
                <img src="https://picsum.photos/250/180" alt="Sample image">
            </div>

            <div class="content">

                <h2>Contact Us</h2>

                <form>

                    <input type="text" placeholder="Enter your name">

                    <input type="email" placeholder="Enter your email">

                    <textarea placeholder="Enter your message"></textarea>

                    <div class="buttons">
                        <button type="submit">Submit</button>
                        <button type="reset">Reset</button>
                    </div>

                </form>

            </div>

        </section>

    </main>

    <footer>
        <p>© 2026 Mini UI. All Rights Reserved.</p>
    </footer>

</body>
</html>
