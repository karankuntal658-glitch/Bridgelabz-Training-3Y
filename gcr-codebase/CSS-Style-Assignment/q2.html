<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tooltip Demonstration</title>
    <link rel="stylesheet" href="q2.css">
</head>
<body>

    <main class="container">

        <h1>CSS Tooltip Demonstration</h1>

        <section class="tooltip-container">

            <div class="tooltip-box">
                Home
                <span class="tooltip">Go to Home</span>
            </div>

            <div class="tooltip-box">
                Search
                <span class="tooltip">Search for something</span>
            </div>

            <div class="tooltip-box">
                Profile
                <span class="tooltip">View your profile</span>
            </div>

            <div class="tooltip-box">
                Help
                <span class="tooltip">Get help and support</span>
            </div>

        </section>

    </main>

</body>
</html>
