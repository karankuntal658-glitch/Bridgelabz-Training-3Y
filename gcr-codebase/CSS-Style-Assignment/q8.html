<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Sizing Comparison</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <main class="container">

        <h1>Box-Sizing Comparison</h1>

        <section class="comparison">

            <div class="box default-box">
                <h2>Default Box</h2>
                <p>
                    This box uses content-box. Padding and border are added
                    outside the declared width.
                </p>
            </div>

            <div class="box border-box">
                <h2>Border-Box</h2>
                <p>
                    This box uses border-box. Padding and border are included
                    inside the declared width.
                </p>
            </div>

        </section>

    </main>

</body>
</html>
