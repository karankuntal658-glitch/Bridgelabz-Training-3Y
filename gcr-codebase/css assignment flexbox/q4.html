<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="question4.css">
</head>
<body>

    <div class="dashboard">

        <header>
            <h1>Dashboard</h1>
        </header>

        <aside>
            <h2>Menu</h2>
            <nav>
                <a href="#">Home</a>
                <a href="#">Profile</a>
                <a href="#">Reports</a>
                <a href="#">Settings</a>
            </nav>
        </aside>

        <main>
            <div class="box">
                <h2>Users</h2>
                <p>1,250</p>
            </div>

            <div class="box">
                <h2>Orders</h2>
                <p>450</p>
            </div>

            <div class="box">
                <h2>Revenue</h2>
                <p>₹2,50,000</p>
            </div>

            <div class="box">
                <h2>Products</h2>
                <p>850</p>
            </div>

            <div class="box large-box">
                <h2>Monthly Performance</h2>
                <p>Performance information is displayed here.</p>
            </div>
        </main>

    </div>

</body>
</html>
