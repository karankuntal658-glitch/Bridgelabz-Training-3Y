<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>
    <link rel="stylesheet" href="q5.css">
</head>
<body>

    <main class="pricing">
        <h1>Choose Your Plan</h1>

        <div class="plans">

            <section class="plan">
                <h2>Basic</h2>
                <p class="price">$9<span>/month</span></p>

                <ul>
                    <li>5 Projects</li>
                    <li>10 GB Storage</li>
                    <li>Email Support</li>
                </ul>

                <a href="#" class="button">Choose Basic</a>
            </section>

            <section class="plan popular">
                <div class="badge">Most Popular</div>
                <h2>Standard</h2>
                <p class="price">$19<span>/month</span></p>

                <ul>
                    <li>20 Projects</li>
                    <li>50 GB Storage</li>
                    <li>Priority Support</li>
                </ul>

                <a href="#" class="button">Choose Standard</a>
            </section>

            <section class="plan">
                <h2>Premium</h2>
                <p class="price">$39<span>/month</span></p>

                <ul>
                    <li>Unlimited Projects</li>
                    <li>200 GB Storage</li>
                    <li>24/7 Support</li>
                </ul>

                <a href="#" class="button">Choose Premium</a>
            </section>

        </div>
    </main>

</body>
</html>
