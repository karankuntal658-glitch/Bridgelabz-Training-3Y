<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="q8.css">
</head>
<body>

    <header class="dashboard-header">
        <h1>My Dashboard</h1>
    </header>

    <div class="dashboard">

        <aside class="sidebar">
            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Profile</a>
                <a href="#">Messages</a>
                <a href="#">Settings</a>
                <a href="#">Logout</a>
            </nav>
        </aside>

        <main class="content">

            <section class="content-box">
                <h2>Welcome Back!</h2>
                <p>
                    This is your dashboard overview. Here you can manage
                    your profile and view recent activity.
                </p>
            </section>

            <section class="content-box">
                <h2>Recent Activity</h2>
                <p>
                    You have completed 12 tasks and received 5 new messages.
                </p>
            </section>

        </main>

    </div>

</body>
</html>
